<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Frontend design research and implementation guidance for Codex and Claude Code.">
  <title>front-taste-ref</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f6f8fc;
      --surface: #ffffff;
      --ink: #172b4d;
      --line: #d8e1ec;
      --accent: #00685f;
      --selected: #e0f3ef;
      --code: #eef3f9;
      font: 100%/1.65 Inter, system-ui, "PingFang SC", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141d2c;
        --surface: #192438;
        --ink: #e9f1fc;
        --line: #394a62;
        --accent: #8be4d6;
        --selected: #183c40;
        --code: #222f46;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    a { color: var(--accent); text-underline-offset: .18em; }
    .shell { width: min(100% - 2rem, 54rem); margin-inline: auto; }
    header { position: sticky; top: 0; z-index: 1; background: var(--surface); border-bottom: 1px solid var(--line); }
    .masthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; padding-block: .75rem; }
    h1 { margin: 0; font-size: 1.15rem; letter-spacing: -.02em; }
    [role="tablist"] { display: flex; gap: .25rem; padding: .2rem; border: 1px solid var(--line); border-radius: .6rem; }
    [role="tab"] { border: 0; padding: .45rem .75rem; border-radius: .4rem; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    [aria-selected="true"] { background: var(--selected); color: var(--accent); font-weight: 650; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    main { padding-block: clamp(1.5rem, 5vw, 3.5rem); }
    section { min-width: 0; }
    h2 { margin: 0 0 .75rem; font-size: clamp(1.7rem, 5vw, 2.5rem); letter-spacing: -.03em; line-height: 1.2; }
    h3 { margin-top: 2.5rem; border-bottom: 1px solid var(--line); padding-bottom: .5rem; }
    h4 { margin-top: 1.5rem; }
    pre, code { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    code { overflow-wrap: anywhere; }
    pre { overflow-x: auto; padding: 1rem; background: var(--code); border: 1px solid var(--line); border-radius: .5rem; line-height: 1.5; }
    blockquote { margin-inline: 0; padding-left: 1rem; border-left: 3px solid var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; padding: .55rem; }
  </style>
</head>
<body>
  <header>
    <div class="shell masthead">
      <h1>front-taste-ref</h1>
      <div role="tablist" aria-label="文档语言 / Documentation language">
        <button type="button" role="tab" id="tab-zh" aria-controls="panel-zh" aria-selected="true" lang="zh-CN">中文</button>
        <button type="button" role="tab" id="tab-en" aria-controls="panel-en" aria-selected="false" tabindex="-1" lang="en">English</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section id="panel-zh" role="tabpanel" aria-labelledby="tab-zh" lang="zh-CN" tabindex="0">
      <!-- content:zh -->
    </section>
    <section id="panel-en" role="tabpanel" aria-labelledby="tab-en" lang="en" tabindex="0" hidden>
      <!-- content:en -->
    </section>
  </main>

  <script>
    const tabs = [...document.querySelectorAll('[role="tab"]')];
    const panels = tabs.map(tab => document.getElementById(tab.getAttribute('aria-controls')));
    const tabFromHash = () => tabs.find(tab => tab.id === 'tab-' + location.hash.slice(1)) || tabs[0];

    function selectTab(selected) {
      tabs.forEach((tab, index) => {
        const active = tab === selected;
        tab.setAttribute('aria-selected', active);
        tab.tabIndex = active ? 0 : -1;
        panels[index].hidden = !active;
      });
      document.documentElement.lang = selected.lang;
    }

    function activate(tab) {
      selectTab(tab);
      history.replaceState(null, '', '#' + tab.id.slice(4));
      window.scrollTo(0, 0);
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => activate(tab));
      tab.addEventListener('keydown', event => {
        let next;
        if (event.key === 'ArrowRight') next = tabs[(index + 1) % tabs.length];
        else if (event.key === 'ArrowLeft') next = tabs[(index - 1 + tabs.length) % tabs.length];
        else if (event.key === 'Home') next = tabs[0];
        else if (event.key === 'End') next = tabs.at(-1);
        else return;
        event.preventDefault();
        activate(next);
        next.focus();
      });
    });

    window.addEventListener('hashchange', () => selectTab(tabFromHash()));
    selectTab(tabFromHash());
  </script>
</body>
</html>
